<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Project_Enchant</title>
    <style>
      :root {
        --footer-height: 40px;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101318;
        color: #e8edf3;
        font-family: Arial, sans-serif;
      }

      #unity-container {
        position: relative;
        display: flex;
        flex: 0 0 auto;
        flex-direction: column;
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden;
        background: #171b22;
      }

      #unity-canvas {
        display: block;
        flex: 0 0 auto;
        margin: 0;
        background: #231F20;
      }

      #unity-canvas:fullscreen {
        width: 100vw !important;
        height: 100vh !important;
      }

      #unity-loading-bar {
        position: absolute;
        z-index: 2;
        inset: 0 0 var(--footer-height) 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(10, 13, 18, 0.92);
      }

      #unity-loading-panel {
        width: min(360px, 90%);
        text-align: center;
      }

      #unity-loading-title {
        margin-bottom: 16px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      #unity-progress-bar-empty {
        width: 100%;
        height: 12px;
        overflow: hidden;
        border: 1px solid #4e5868;
        border-radius: 999px;
        background: #222936;
      }

      #unity-progress-bar-full {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #7fc3ff;
        transition: width 120ms linear;
      }

      #unity-loading-status {
        min-height: 18px;
        margin-top: 12px;
        color: #d5dce6;
        font-size: 14px;
      }

      #unity-loading-hint {
        min-height: 16px;
        margin-top: 8px;
        color: #9da9b9;
        font-size: 12px;
      }

      #unity-warning {
        position: absolute;
        z-index: 4;
        top: 8px;
        left: 50%;
        display: none;
        width: min(90%, 720px);
        transform: translateX(-50%);
        color: #111;
        text-align: center;
      }

      #unity-footer {
        display: flex;
        flex: 0 0 var(--footer-height);
        align-items: center;
        width: 100%;
        min-width: 0;
        height: var(--footer-height);
        padding-left: 12px;
        border-top: 1px solid #303743;
        background: #171b22;
      }

      #unity-build-title {
        min-width: 0;
        flex: 1 1 auto;
        overflow: hidden;
        color: #cdd5df;
        font-size: 14px;
        line-height: var(--footer-height);
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #unity-fullscreen-button {
        position: relative;
        flex: 0 0 var(--footer-height);
        width: var(--footer-height);
        height: var(--footer-height);
        padding: 0;
        border: 0;
        border-left: 1px solid #303743;
        background: transparent;
        color: #e8edf3;
        cursor: pointer;
      }

      #unity-fullscreen-button::before {
        position: absolute;
        inset: 12px;
        border: 2px solid currentColor;
        content: "";
      }

      #unity-fullscreen-button:hover:not(:disabled),
      #unity-fullscreen-button:focus-visible {
        background: #2a323f;
        outline: none;
      }

      #unity-fullscreen-button:disabled {
        color: #687383;
        cursor: wait;
      }

      @media (max-width: 280px) {
        #unity-build-title {
          font-size: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main id="unity-container" aria-label="Project_Enchant WebGL Player">
      <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
      <section id="unity-loading-bar" aria-live="polite">
        <div id="unity-loading-panel">
          <div id="unity-loading-title">PROJECT ENCHANT</div>
          <div id="unity-progress-bar-empty" role="progressbar" aria-label="게임 로딩 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="unity-progress-bar-full"></div>
          </div>
          <div id="unity-loading-status">플레이어 로더를 요청하는 중…</div>
          <div id="unity-loading-hint"></div>
        </div>
      </section>
      <div id="unity-warning"></div>
      <footer id="unity-footer">
        <div id="unity-build-title">Project_Enchant</div>
        <button id="unity-fullscreen-button" type="button" title="전체 화면" aria-label="전체 화면으로 전환" disabled></button>
      </footer>
    </main>

    <script>
      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var loadingStatus = document.querySelector("#unity-loading-status");
      var loadingHint = document.querySelector("#unity-loading-hint");
      var progressBar = document.querySelector("#unity-progress-bar-empty");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");
      var warningBanner = document.querySelector("#unity-warning");
      var baseWidth = Number("960") || 960;
      var baseHeight = Number("600") || 600;

      function resizeUnityShell() {
        if (document.fullscreenElement === canvas) return;

        var footerHeight = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--footer-height")) || 40;
        var availableWidth = Math.max(0, window.innerWidth);
        var availableHeight = Math.max(0, window.innerHeight - footerHeight);
        var scale = Math.max(0, Math.min(1, availableWidth / baseWidth, availableHeight / baseHeight));
        var canvasWidth = Math.floor(baseWidth * scale);
        var canvasHeight = Math.floor(baseHeight * scale);

        canvas.style.width = canvasWidth + "px";
        canvas.style.height = canvasHeight + "px";
        container.style.width = canvasWidth + "px";
        container.style.height = canvasHeight + footerHeight + "px";
      }

      function setLoadingProgress(progress) {
        var percent = Math.max(0, Math.min(100, Math.round(progress * 100)));
        progressBarFull.style.width = percent + "%";
        progressBar.setAttribute("aria-valuenow", String(percent));

        if (percent < 10) loadingStatus.textContent = "게임 파일을 확인하는 중… " + percent + "%";
        else if (percent < 90) loadingStatus.textContent = "게임 데이터를 불러오는 중… " + percent + "%";
        else if (percent < 100) loadingStatus.textContent = "엔진을 준비하는 중… " + percent + "%";
        else loadingStatus.textContent = "게임을 시작하는 중…";
      }

      function unityShowBanner(message, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }

        var item = document.createElement("div");
        item.textContent = message;
        item.style.padding = "10px";
        item.style.background = type === "error" ? "#ff8d8d" : "#ffe38d";
        warningBanner.appendChild(item);
        updateBannerVisibility();

        if (type !== "error") {
          setTimeout(function () {
            item.remove();
            updateBannerVisibility();
          }, 5000);
        }
      }

      window.addEventListener("resize", resizeUnityShell, { passive: true });
      document.addEventListener("fullscreenchange", resizeUnityShell);
      resizeUnityShell();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/ea153e321edf23b9a40b38d65ce41d01.loader.js";
      var config = {
        dataUrl: buildUrl + "/9eab7f1c69811011636606d6d93d326d.data",
        frameworkUrl: buildUrl + "/4cd202b48e01c8deb4e7d0cb7bdd4ae5.framework.js",
        codeUrl: buildUrl + "/543487a481aebd96ea007c09b84ef62e.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Project_Enchant",
        productVersion: "0.2.0",
        showBanner: unityShowBanner,
        cacheControl: function (url) {
          return url.indexOf(buildUrl + "/") !== -1 ? "immutable" : "no-store";
        },
      };


      var slowLoadingHint = setTimeout(function () {
        loadingHint.textContent = "첫 실행은 다운로드와 브라우저 캐시 준비로 시간이 더 걸릴 수 있습니다.";
      }, 15000);

      var loaderScript = document.createElement("script");
      loaderScript.src = loaderUrl;
      loaderScript.onload = function () {
        loadingStatus.textContent = "게임 파일을 확인하는 중…";
        createUnityInstance(canvas, config, setLoadingProgress).then(function (unityInstance) {
          clearTimeout(slowLoadingHint);
          loadingBar.style.display = "none";
          fullscreenButton.disabled = false;
          fullscreenButton.onclick = function () {
            unityInstance.SetFullscreen(1);
          };
        }).catch(function (message) {
          clearTimeout(slowLoadingHint);
          loadingStatus.textContent = "게임을 시작하지 못했습니다.";
          loadingHint.textContent = String(message);
          unityShowBanner(String(message), "error");
        });
      };
      loaderScript.onerror = function () {
        clearTimeout(slowLoadingHint);
        loadingStatus.textContent = "플레이어 로더를 받지 못했습니다.";
        loadingHint.textContent = "네트워크 연결을 확인한 뒤 새로고침해 주세요.";
      };
      document.body.appendChild(loaderScript);
    </script>
  </body>
</html>
